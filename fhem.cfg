define CheckEventMorgen2 at *16:05:00 {\
 my $Eventname;;\
 my $EventMorgen;;\
 $EventMorgen = fhem("get abfall2 tomorrow");;\
 Log 3, 'about to use DebianMail for $EventMorgen';;\
 if ($EventMorgen ne "none") {\
  $Eventname = wochentag($wday+1).": $EventMorgen" ;;\
  {DebianMailNoAttach('hjgode@gmail.com,ottigode@googlemail.com','FHEM Abfall-Erinnerung', "$Eventname -> $Eventname")};;\
 }\
}
