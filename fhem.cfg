define CheckEventWoche2 at *16:00:00 {\
 my $Eventname;;\
 my $EventWoche;;\
 $EventWoche = "6 Tage:\nMontag: ".fhem("get abfall2 days 1")."\nDienstag: ".fhem("get abfall2 days 2")."\nMittwoch: ".fhem("get abfall2 days 3")."\nDonnerstag: ".fhem("get abfall2 days 4")."\nFreitag: ".fhem("get abfall2 days 5")."\nSamstag: ".fhem("get abfall2 days 6");;\
 if ($wday == 0){\
  Log 3, 'about to use DebianMail for $EventWoche';;\
  if ($EventWoche ne "none") {\
   $Eventname = "Reminder: $EventWoche" ;;\
   { DebianMailNoAttach('hjgode@gmail.com;;ottigode@googlemail.com','FHEM Abfall2-Erinnerung', "$Eventname -> $Eventname") };;\
#   { DebianMailNoAttach('ottigode@googlemail.com','FHEM Abfall2-Erinnerung', "$Eventname -> $Eventname") };;\
  }\
 }\
}
