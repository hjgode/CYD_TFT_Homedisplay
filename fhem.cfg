define di_BadLuftAnAus2 DOIF ( ([HM_58AD5B:state] eq "closed") and ([Hideki_30_4:Luefter] eq "on") )\
  ( ##Temperatur ist dezimal, Luefter soll an gehen\
      {Log 1, "doifbadluefter: Luefter=on"},\
      IF ( [HM_58AD5B:state] eq "closed")\
	  (\
	     {Log 1, "doifbadluefter: Fenster closed"},\
	     IF ( ([HM_58AD5B:alive] eq "alive") or ([HM_58AD5B:alive] eq "yes") ) \
		 (\
		    {Log 1, "doifbadluefter: Fenster alive"},\
   	        {Log 1, "doifbadluefter: schalterbadfeuchte2 on"},\
	        set schalterbadfeuchte2 on\
		 )\
		 ELSE\
		 (\
		    {Log 1, "doifbadluefter: Fenster dead, schalterbadfeuchte2 off"},\
			set schalterbadfeuchte2 off\
		 )\
	  )\
	  ELSE\
	  (\
	     {Log 1, "doifbadluefter: Fenster open, schalterbadfeuchte2 off"},\
 	     set schalterbadfeuchte2 off\
	  )\
	\
  )\
  DOELSE\
  (\
     {Log 1, "doifbadluefter: Luefter=off"},\
	set schalterbadfeuchte2 off\
  )\

